<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AR Model Viewer</title>
	<script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
	<style>
		body {
			margin: 0;
			padding: 0;
			background: #0d1117;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
		}

		model-viewer {
			width: 100vw;
			height: 100vh;
			--poster-color: #0d1117;
		}

		#overlay {
			position: fixed;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 12px;
			pointer-events: none;
			z-index: 10;
		}

		#statusText {
			color: #8899bb;
			font-size: 15px;
			font-family: 'Space Mono', monospace, monospace;
			letter-spacing: 0.05em;
		}

		#arPrompt {
			display: none;
			flex-direction: column;
			align-items: center;
			gap: 10px;
			pointer-events: all;
		}

		#arPrompt p {
			color: #8899bb;
			font-size: 13px;
			margin: 0;
		}

		#arButton {
			background: #00d4ff;
			color: #070a0f;
			border: none;
			padding: 14px 32px;
			border-radius: 25px;
			font-size: 16px;
			font-weight: 700;
			cursor: pointer;
			letter-spacing: 0.05em;
			transition: box-shadow 0.2s, transform 0.2s;
		}

		#arButton:hover {
			box-shadow: 0 4px 20px rgba(0, 212, 255, 0.4);
			transform: translateY(-1px);
		}

		/* iOS-only banner: shown when no USDZ is available */
		#iosBanner {
			display: none;
			position: fixed;
			bottom: 24px;
			left: 50%;
			transform: translateX(-50%);
			background: rgba(255, 170, 0, 0.12);
			border: 1px solid rgba(255, 170, 0, 0.35);
			border-radius: 10px;
			padding: 12px 20px;
			color: #ffaa00;
			font-size: 13px;
			text-align: center;
			max-width: 320px;
			z-index: 20;
			line-height: 1.5;
		}
	</style>
</head>
<body>
	<div id="overlay">
		<span id="statusText">Loading 3D Model…</span>
		<div id="arPrompt">
			<p>Ready for AR — tap below to place in your space</p>
			<button id="arButton">📱 Launch AR</button>
		</div>
	</div>

	<div id="iosBanner">
		⚠️ AR is not available on this iPhone/iPad — the owner has not uploaded a USDZ file.
	</div>

	<!--
		• src       → GLB, used on Android / desktop / WebXR
		• ios-src   → USDZ, used by Safari Quick Look on iPhone/iPad
		Both are set dynamically below after checking has_usdz from the metadata endpoint.
	-->
	<model-viewer
		id="modelViewer"
		camera-controls
		ar
		ar-modes="webxr scene-viewer quick-look"
		autoplay
		auto-rotate
		shadow-intensity="1"
		interaction-prompt="none"
		style="width:100vw; height:100vh;"
	></model-viewer>

	<script>
		// Strip the leading slash to get the query token, e.g. "ab3c9x"
		const query = location.pathname.slice(1);

		let baseUrl = "%%BASE_URL%%";
		// If served statically (e.g. on Vercel/Netlify) where %%BASE_URL%% was not replaced,
		// automatically resolve the backend API based on current domain:
		if (baseUrl.includes("%%BASE_URL%%") || !baseUrl) {
			const host = window.location.hostname;
			if (host.startsWith("dev-") || host.includes("dev")) {
				baseUrl = "https://dev-api.gamchngr.xyz";
			} else if (host === "localhost" || host === "127.0.0.1") {
				baseUrl = "http://127.0.0.1:8080";
			} else {
				baseUrl = "https://api.gamchngr.xyz";
			}
		}

		const modelViewer = document.getElementById("modelViewer");
		const statusText  = document.getElementById("statusText");
		const arPrompt    = document.getElementById("arPrompt");
		const arButton    = document.getElementById("arButton");
		const iosBanner   = document.getElementById("iosBanner");

		const isApple = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
		                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

		const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

		function activateAR() {
			if (modelViewer.canActivateAR) modelViewer.activateAR();
		}

		async function loadModel() {
			if (!query) return;

			// ── 1. Fetch public model metadata ──────────────────────────────
			// GET /model/files/:query would immediately redirect to the file.
			// We need the metadata (has_usdz) first, so we hit the public
			// metadata route exposed for the AR viewer: GET /ar/meta/:query
			// (see routes.go suggestion below).
			// If that route doesn't exist yet, fall back to has_usdz = false.
			let hasUsdz = false;
			try {
				const metaResp = await fetch(`${baseUrl}/ar/meta/${query}`);
				if (metaResp.ok) {
					const meta = await metaResp.json();
					hasUsdz = !!meta.has_usdz;
				}
			} catch (e) {
				console.warn("Metadata fetch failed, continuing without USDZ info:", e);
			}

			// ── 2. Set the GLB source (Android, desktop, WebXR) ─────────────
			// The Go backend's GetModelRedirect already sniffs User-Agent and
			// redirects Safari/iOS to the USDZ presigned URL automatically.
			// We still set ios-src explicitly so model-viewer's Quick Look
			// integration works even on browsers that don't follow the redirect.
			modelViewer.src = `${baseUrl}/model/files/${query}`;

			// ── 3. Set ios-src for Apple Quick Look ─────────────────────────
			// The backend serves USDZ from the same /model/files/:query URL for
			// Safari user-agents, but model-viewer needs ios-src set to a URL
			// that directly returns the .usdz file (Quick Look is picky).
			// We point ios-src at a dedicated USDZ endpoint so there's no
			// ambiguity. The backend should expose GET /model/files/usdz/:query
			// that always returns the USDZ presigned redirect (see routes.go).
			if (hasUsdz) {
				modelViewer.setAttribute("ios-src", `${baseUrl}/model/files/usdz/${query}`);
			} else if (isApple) {
				// No USDZ uploaded — warn the iOS user.
				iosBanner.style.display = "block";
			}

			// ── 4. Wire up model-viewer events ──────────────────────────────
			modelViewer.addEventListener("load", () => {
				statusText.style.display = "none";

				// Show the AR launch prompt on mobile after a short pause.
				if (isMobile && !isApple && modelViewer.canActivateAR) {
					// Android / WebXR path — prompt user to tap AR button.
					setTimeout(() => { arPrompt.style.display = "flex"; }, 900);
				}
				// On iOS, model-viewer renders its own native Quick Look button
				// automatically when ios-src is set — no custom button needed.
			});

			modelViewer.addEventListener("error", () => {
				statusText.textContent = "Failed to load model.";
			});

			modelViewer.addEventListener("ar-status", (event) => {
				if (event.detail.status === "session-started") {
					arPrompt.style.display = "none";
				}
			});

			arButton.addEventListener("click", () => {
				arPrompt.style.display = "none";
				activateAR();
			});
		}

		loadModel();
	</script>
</body>
</html>
