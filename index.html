<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AR Model Viewer</title>
	<script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
		}

		#modelViewer {
			width: 100vw;
			height: 100vh;
		}

		.ar-prompt {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			background: rgba(0, 0, 0, 0.8);
			color: white;
			padding: 20px;
			border-radius: 10px;
			text-align: center;
			z-index: 1000;
			display: none;
		}

		.ar-button {
			background: #007AFF;
			color: white;
			border: none;
			padding: 15px 30px;
			border-radius: 25px;
			font-size: 18px;
			font-weight: 600;
			cursor: pointer;
			margin-top: 15px;
			transition: all 0.3s ease;
		}

		.ar-button:hover {
			background: #0056CC;
			transform: scale(1.05);
		}

		.loading {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			color: #666;
			font-size: 18px;
			z-index: 100;
		}
	</style>
</head>
<body>
	<div class="loading" id="loading">Loading 3D Model...</div>

	<div class="ar-prompt" id="arPrompt">
		<div>📱 Ready for AR!</div>
		<div style="margin: 10px 0; font-size: 14px;">Tap below to view the model in your space</div>
		<button class="ar-button" id="arButton">Launch AR</button>
	</div>

	<!--
		ios-src is set dynamically after the metadata fetch below.
		When set, model-viewer uses QuickLook on iOS/Safari automatically
		instead of WebXR, giving the best native AR experience on Apple devices.
	-->
	<model-viewer
		id="modelViewer"
		camera-controls
		ar
		ar-modes="webxr scene-viewer quick-look"
		autoplay
		auto-rotate
		interaction-prompt="none"
		style="width: 100vw; height: 100vh;"
	></model-viewer>

	<script>
		const param = location.pathname.slice(1); // e.g. "ab3c9x"
		const baseUrl = "https://questionnaire-britain-adware-dirt.trycloudflare.com";

		const modelViewer = document.getElementById("modelViewer");
		const loading     = document.getElementById("loading");
		const arPrompt    = document.getElementById("arPrompt");
		const arButton    = document.getElementById("arButton");

		function isMobileDevice() {
			return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
		}

		function isAppleDevice() {
			return /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
			       (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
		}

		function activateAR() {
			if (modelViewer.canActivateAR) {
				modelViewer.activateAR();
			}
		}

		async function loadModel() {
			if (!param) return;

			// 1. Fetch metadata to get the ios_src URL (USDZ) if available
			let iosSrc = null;
			try {
				const metaResp = await fetch(`${baseUrl}/model/${param}`);
				if (metaResp.ok) {
					const meta = await metaResp.json();
					// ios_src is an absolute path like "/model/files/ios/ab3c9x"
					if (meta.ios_src) {
						iosSrc = `${baseUrl}${meta.ios_src}`;
					}
				}
			} catch (e) {
				console.warn("Could not fetch model metadata:", e);
			}

			// 2. Set the GLB source (primary, works on Android & desktop)
			modelViewer.src = `${baseUrl}/model/files/${param}`;

			// 3. Set ios-src for QuickLook on Apple devices.
			//    model-viewer uses this automatically on Safari/iOS; no extra JS needed.
			if (iosSrc) {
				modelViewer.setAttribute("ios-src", iosSrc);
			}

			// 4. Event listeners
			modelViewer.addEventListener("load", () => {
				loading.style.display = "none";

				if (isMobileDevice() && modelViewer.canActivateAR) {
					setTimeout(() => { arPrompt.style.display = "block"; }, 1000);
				}
			});

			modelViewer.addEventListener("error", () => {
				loading.innerHTML = "Failed to load model";
			});

			modelViewer.addEventListener("ar-status", (event) => {
				if (event.detail.status === "session-started") {
					arPrompt.style.display = "none";
				}
			});

			arButton.addEventListener("click", () => {
				arPrompt.style.display = "none";
				activateAR();
			});
		}

		loadModel();

		// Touch fallback: try AR on first touch (non-iOS only, iOS uses QuickLook natively)
		let hasTriedAR = false;
		document.addEventListener("touchstart", () => {
			if (!hasTriedAR && !isAppleDevice() && modelViewer.canActivateAR && isMobileDevice()) {
				hasTriedAR = true;
				setTimeout(activateAR, 500);
			}
		});
	</script>
</body>
</html>
